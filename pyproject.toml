[project]
name = "iam-attack-path-agent"
version = "0.1.0"
description = "Agent that finds IAM/K8s privilege-escalation paths in FalkorDB and proposes least-privilege fixes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0",
    "openai>=1.40",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
iamgraph = "iamgraph.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iamgraph"]
